services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: code_forge
      POSTGRES_USER: code_forge
      POSTGRES_PASSWORD: code_forge
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code_forge -d code_forge"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://code_forge:code_forge@postgres:5432/code_forge?schema=public
      GIT_STORAGE_PATH: /data/git
      FRONTEND_ORIGIN: http://localhost:3000
    ports: ["4000:4000"]
    volumes: ["git-data:/data/git"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
  git-data:
